# Local configuration only. Cloud test project refs are environment variables.
project_id = "isolated-test"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Confirm the hosted production major version before claiming exact parity.
major_version = 17

[db.seed]
enabled = false
# Seed is generated explicitly from TEST_BUSINESS_ID after baseline validation.

[functions.ops-collect]
verify_jwt = true

[functions.clover-webhook]
# Clover sends X-Clover-Auth, not a Supabase JWT.
verify_jwt = false
