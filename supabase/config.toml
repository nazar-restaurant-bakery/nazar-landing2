# Local configuration only. Cloud test project refs are environment variables.
project_id = "isolated-test"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Confirm the hosted production major version before claiming exact parity.
major_version = 17

[db.seed]
enabled = false
# Seed is generated explicitly from TEST_BUSINESS_ID after baseline validation.

[functions.ops-collect]
verify_jwt = true

[functions.clover-webhook]
# Clover sends X-Clover-Auth, not a Supabase JWT.

verify_jwt = false

# Machine-only HMAC endpoint; existing personnel JWT gates stay enabled.
[functions.daily-ops-run]
verify_jwt = false

[functions.ops-write]
verify_jwt = true

[functions.staff-manage-invite]
verify_jwt = true

# Default-off consumer; purpose-bound HMAC is mandatory before all DB/network.
[functions.coupon-welcome-run]
verify_jwt = false

# Called by market.places_run_v1 via pg_net without a JWT; the purpose-bound
# X-Scheduler-Signature HMAC inside the function is the authentication.
[functions.market-places]
verify_jwt = false

# Called by market.ads_run_v1 / market.ads_cron_tick_v1 via pg_net without a JWT; the
# purpose-bound X-Scheduler-Signature HMAC inside the function is the authentication.
[functions.market-ads]
verify_jwt = false
