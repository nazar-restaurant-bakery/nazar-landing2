name = "go-growth-engine"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
routes = [ { pattern = "links.nazarrestaurantandbakery.com", custom_domain = true } ]
workers_dev = true
preview_urls = true

[triggers]
crons = ["7 * * * *"]

# Gizli değerler burada değil: Cloudflare secrets (yerelde .dev.vars)
[vars]
GO_SCHEDULER_ENABLED = "false"

[observability]
enabled = true
